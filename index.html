<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study AI - Visual Notes & Mind Map Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    <!-- Mermaid.js -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <style>
        body { font-family: 'Padauk', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .glass-panel { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(12px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .mermaid { background: white; border-radius: 0.5rem; padding: 1rem; }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-700/50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600 rounded-lg text-white">
                <i class="fa-solid fa-brain text-2xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-white tracking-wide">Smart Study AI</h1>
                <p class="text-xs text-slate-400">Visual Notes & Mind Map Generator</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <button id="login-btn" onclick="demoLogin()" class="px-4 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-lg transition flex items-center gap-2">
                <i class="fa-brands fa-google"></i> Google အကောင့်ဖြင့် ဝင်မည်
            </button>
            <div id="user-profile" class="hidden flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <i class="fa-solid fa-circle-user text-indigo-400 text-lg"></i>
                <span id="user-name" class="text-sm font-medium text-slate-200">မင်္ဂလာပါ</span>
            </div>
        </div>
    </header>

    <!-- Main Content -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-6">
        <!-- Input Section -->
        <section class="flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col">
                <h2 class="text-lg font-semibold text-indigo-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-key"></i> Gemini API Key ထည့်ပါ
                </h2>
                <input type="password" id="api-key" placeholder="AI Studio API Key ကို ဤနေရာတွင် ထည့်ပါ..." class="w-full p-3 mb-4 bg-slate-900 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500 text-sm">

                <h2 class="text-lg font-semibold text-indigo-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> စာသား သို့မဟုတ် မှတ်စုထည့်ပါ
                </h2>
                <textarea id="input-text" class="w-full flex-1 min-h-[220px] p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500 resize-none font-sans" placeholder="မှတ်စုများ သို့မဟုတ် သင်ခန်းစာ စာသားများကို ဤနေရာတွင် ရိုက်ထည့်ပါ..."></textarea>

                <div class="mt-4 flex justify-end">
                    <button id="generate-btn" onclick="generateContent()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI ဖြင့် Mind Map ထုတ်မည်
                    </button>
                </div>
            </div>
        </section>

        <!-- Output Section -->
        <section class="flex flex-col gap-4">
            <div id="output-container" class="glass-panel rounded-2xl p-6 flex-1 flex flex-col overflow-y-auto max-h-[75vh]">
                <div id="placeholder-text" class="flex-1 flex flex-col items-center justify-center text-slate-500 text-center py-12">
                    <i class="fa-solid fa-diagram-project text-5xl mb-4 text-slate-600"></i>
                    <p>သင်၏ မှတ်စုများနှင့် Mind Map များကို ဤနေရာတွင် ပြသပေးမည်ဖြစ်ပါသည်။</p>
                </div>

                <div id="loading" class="hidden flex-1 flex flex-col items-center justify-center py-12">
                    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-indigo-400 font-medium">AI မှ အချက်အလက်များ တည်ဆောက်နေပါသည်...</p>
                </div>

                <div id="result-content" class="hidden space-y-6">
                    <div>
                        <h3 class="text-md font-semibold text-indigo-400 mb-2">📌 သင်ခန်းစာ အနှစ်ချုပ်</h3>
                        <div id="summary-text" class="bg-slate-900/60 p-4 rounded-xl text-slate-300 text-sm leading-relaxed border border-slate-800"></div>
                    </div>
                    <div>
                        <h3 class="text-md font-semibold text-indigo-400 mb-2">🧠 Mind Map Diagram</h3>
                        <div id="mermaid-diagram" class="mermaid overflow-x-auto text-black"></div>
                    </div>
                </div>
            </div>
        </section>
    </main>

    <script>
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        function demoLogin() {
            document.getElementById('login-btn').classList.add('hidden');
            document.getElementById('user-profile').classList.remove('hidden');
            alert('အကောင့်ဝင်ရောက်ခြင်း အောင်မြင်ပါသည်။');
        }

        async function generateContent() {
            const apiKey = document.getElementById('api-key').value.trim();
            const textInput = document.getElementById('input-text').value.trim();

            if (!textInput) {
                alert('ကျေးဇူးပြု၍ စာသားတစ်ခုခု ရိုက်ထည့်ပါ။');
                return;
            }

            document.getElementById('placeholder-text').classList.add('hidden');
            document.getElementById('result-content').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                if (apiKey) {
                    // Call Gemini API using correct model name 'gemini-1.5-flash'
                    const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                        method: 'POST',
                        headers: { 'Content-Type': 'application/json' },
                        body: JSON.stringify({
                            contents: [{
                                parts: [{
                                    text: `Summarize this text in Myanmar and make a simple Mermaid.js diagram code:\n${textInput}`
                                }]
                            }]
                        })
                    });

                    const data = await response.json();
                    if (data.error) throw new Error(data.error.message);

                    const resultText = data.candidates[0].content.parts[0].text;
                    document.getElementById('summary-text').innerText = resultText;
                } else {
                    // Demo fallback if API key is not entered
                    document.getElementById('summary-text').innerText = "စာသား အနှစ်ချုပ် - " + textInput;
                }

                // Render Mind Map
                const mockMermaid = `graph TD\n A[သင်ခန်းစာ] --> B[အဓိက အချက် 1]\n A --> C[အဓိက အချက် 2]\n B --> D[အသေးစိတ်]`;
                const mermaidDiv = document.getElementById('mermaid-diagram');
                mermaidDiv.removeAttribute('data-processed');
                mermaidDiv.innerHTML = mockMermaid;
                await mermaid.contentLoaded();

                document.getElementById('loading').classList.add('hidden');
                document.getElementById('result-content').classList.remove('hidden');

            } catch (err) {
                alert('Error: ' + err.message);
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('placeholder-text').classList.remove('hidden');
            }
        }
    </script>
</body>
</html>
