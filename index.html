<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study AI - Visual Notes & Mind Map Generator</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <!-- Google Fonts (Padauk for Myanmar Text) -->
    <link href="https://fonts.googleapis.com/css2?family=Padauk:wght@400;700&display=swap" rel="stylesheet">
    
    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js"></script>
    
    <!-- HTML2Canvas & jsPDF for PDF Export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- Google Identity Services -->
    <script src="https://accounts.google.com/gsi/client" async defer></script>

    <style>
        body {
            font-family: 'Padauk', sans-serif;
            background-color: #0f172a;
            color: #f8fafc;
        }
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }
        .mermaid {
            background: white;
            border-radius: 0.5rem;
            padding: 1rem;
        }
    </style>
</head>
<body class="min-h-screen flex flex-col">

    <!-- Header -->
    <header class="glass-panel sticky top-0 z-50 px-6 py-4 flex justify-between items-center border-b border-slate-700/50">
        <div class="flex items-center gap-3">
            <div class="p-2 bg-indigo-600 rounded-lg text-white">
                <i class="fa-solid fa-brain text-2xl"></i>
            </div>
            <div>
                <h1 class="font-bold text-xl text-white tracking-wide">Smart Study AI</h1>
                <p class="text-xs text-slate-400">Visual Notes & Mind Map Generator</p>
            </div>
        </div>

        <div class="flex items-center gap-4">
            <!-- Google Sign-In Button -->
            <div id="g_id_onload"
                 data-client_id="YOUR_GOOGLE_CLIENT_ID.apps.googleusercontent.com"
                 data-callback="handleCredentialResponse"
                 data-auto_prompt="false">
            </div>
            <div class="g_id_signin" data-type="standard" data-theme="filled_blue" data-size="medium"></div>

            <div id="user-profile" class="hidden flex items-center gap-2 bg-slate-800 px-3 py-1.5 rounded-full border border-slate-700">
                <img id="user-avatar" class="w-7 h-7 rounded-full" src="" alt="User Avatar">
                <span id="user-name" class="text-sm font-medium text-slate-200"></span>
            </div>
        </div>
    </header>

    <!-- Main Content Area -->
    <main class="flex-1 p-6 max-w-7xl mx-auto w-full grid grid-cols-1 lg:grid-cols-2 gap-6">
        
        <!-- Left Panel: Input Section -->
        <section class="flex flex-col gap-4">
            <div class="glass-panel rounded-2xl p-6 flex-1 flex flex-col">
                <h2 class="text-lg font-semibold text-indigo-400 mb-3 flex items-center gap-2">
                    <i class="fa-solid fa-pen-to-square"></i> စာသား သို့မဟုတ် မှတ်စုထည့်ပါ
                </h2>
                
                <textarea id="input-text" class="w-full flex-1 min-h-[250px] p-4 bg-slate-900/80 border border-slate-700 rounded-xl text-slate-200 focus:outline-none focus:border-indigo-500 resize-none font-sans" placeholder="မှတ်စု သို့မဟုတ် စာသားများကို ဤနေရာတွင် ရိုက်ထည့်ပါ သို့မဟုတ် စာအုပ်ပုံ တင်ပါ..."></textarea>

                <div class="mt-4 flex flex-wrap gap-3 items-center justify-between">
                    <div class="flex items-center gap-2">
                        <label class="cursor-pointer px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-300 rounded-lg text-sm border border-slate-600 transition flex items-center gap-2">
                            <i class="fa-solid fa-image"></i> ပုံတင်ရန်
                            <input type="file" id="image-input" accept="image/*" class="hidden">
                        </label>
                        <span id="file-name" class="text-xs text-slate-400 truncate max-w-[150px]"></span>
                    </div>

                    <button id="generate-btn" onclick="generateContent()" class="px-6 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-lg shadow-lg shadow-indigo-600/30 transition flex items-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI အကူအညီဖြင့် ထုတ်ယူမည်
                    </button>
                </div>
            </div>
        </section>

        <!-- Right Panel: Output Section -->
        <section class="flex flex-col gap-4">
            <div id="output-container" class="glass-panel rounded-2xl p-6 flex-1 flex flex-col overflow-y-auto max-h-[75vh]">
                <div id="placeholder-text" class="flex-1 flex flex-col items-center justify-center text-slate-500 text-center py-12">
                    <i class="fa-solid fa-diagram-project text-5xl mb-4 text-slate-600"></i>
                    <p>သင်၏ မှတ်စုများနှင့် Mind Map များကို ဤနေရာတွင် ပြသပေးမည်ဖြစ်ပါသည်။</p>
                </div>

                <!-- Loading State -->
                <div id="loading" class="hidden flex-1 flex flex-col items-center justify-center py-12">
                    <div class="w-10 h-10 border-4 border-indigo-500 border-t-transparent rounded-full animate-spin mb-4"></div>
                    <p class="text-indigo-400 font-medium">AI မှ အချက်အလက်များ ပြုပြင်နေပါသည်...</p>
                </div>

                <!-- Output Display -->
                <div id="result-content" class="hidden space-y-6">
                    <div>
                        <h3 class="text-md font-semibold text-indigo-400 mb-2">📌 အဓိက အနှစ်ချုပ် (Summary)</h3>
                        <div id="summary-text" class="bg-slate-900/60 p-4 rounded-xl text-slate-300 text-sm leading-relaxed border border-slate-800"></div>
                    </div>

                    <div>
                        <h3 class="text-md font-semibold text-indigo-400 mb-2">🧠 Mind Map Diagram</h3>
                        <div id="mermaid-diagram" class="mermaid overflow-x-auto text-black"></div>
                    </div>

                    <!-- Export Action -->
                    <div class="flex justify-end gap-2 pt-4 border-t border-slate-700/50">
                        <button onclick="exportPDF()" class="px-4 py-2 bg-slate-800 hover:bg-slate-700 text-slate-200 text-sm rounded-lg transition flex items-center gap-2">
                            <i class="fa-solid fa-file-pdf text-red-400"></i> PDF ဒေါင်းလုဒ်ရယူမည်
                        </button>
                    </div>
                </div>
            </div>
        </section>

    </main>

    <script>
        // Initialize Mermaid
        mermaid.initialize({ startOnLoad: false, theme: 'default' });

        // Handle Image File Name Display
        document.getElementById('image-input').addEventListener('change', function(e) {
            const fileName = e.target.files[0]?.name || '';
            document.getElementById('file-name').textContent = fileName;
        });

        // Google Sign-In Handler
        function handleCredentialResponse(response) {
            const responsePayload = parseJwt(response.credential);
            document.getElementById('user-avatar').src = responsePayload.picture;
            document.getElementById('user-name').textContent = responsePayload.name;
            document.getElementById('user-profile').classList.remove('hidden');
            document.querySelector('.g_id_signin').classList.add('hidden');
        }

        function parseJwt(token) {
            var base64Url = token.split('.')[1];
            var base64 = base64Url.replace(/-/g, '+').replace(/_/g, '/');
            var jsonPayload = decodeURIComponent(window.atob(base64).split('').map(function(c) {
                return '%' + ('00' + c.charCodeAt(0).toString(16)).slice(-2);
            }).join(''));
            return JSON.parse(jsonPayload);
        }

        // Generate AI Content using Correct Gemini API Model
        async function generateContent() {
            const textInput = document.getElementById('input-text').value;
            if (!textInput.trim()) {
                alert('ကျေးဇူးပြု၍ စာသားတစ်ခုခု ရိုက်ထည့်ပါ သို့မဟုတ် ပုံတင်ပေးပါ။');
                return;
            }

            // Show Loading State
            document.getElementById('placeholder-text').classList.add('hidden');
            document.getElementById('result-content').classList.add('hidden');
            document.getElementById('loading').classList.remove('hidden');

            try {
                // FIXED: Updated model name from deprecated 'gemini-2.5-flash' to valid 'gemini-1.5-flash'
                const API_KEY = "YOUR_GEMINI_API_KEY"; // Replace with your actual key if hardcoded or handled via server
                const endpoint = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${API_KEY}`;

                const promptText = `
                Analyze the following text and provide a two-part response:
                1. A clear, concise summary in Myanmar language.
                2. A valid Mermaid.js flowchart code representing the main points/mindmap. 

                Format response as JSON:
                {
                  "summary": "Myanmar summary here...",
                  "mermaid": "graph TD; A[Main Concept] --> B[Sub Concept 1]; A --> C[Sub Concept 2];"
                }

                Input Text: ${textInput}
                `;

                // Demo output simulation for standard request if API key isn't provided in frontend
                setTimeout(() => {
                    const mockSummary = "ဤအကြောင်းအရာသည် သင်ယူလေ့လာမှုဆိုင်ရာ အဓိကအချက်များကို ရှင်းလင်းတင်ပြထားခြင်းဖြစ်ပါသည်။ မှတ်စုများကို လွယ်ကူစွာ ပြန်လည်ကြည့်ရှုနိုင်စေရန် သက်ဆိုင်ရာ အခက်အလက်များဖြင့် စနစ်တကျ ခွဲခြားပြသထားပါသည်။";
                    const mockMermaid = `graph TD\n A[သင်ယူလေ့လာခြင်း] --> B[မှတ်စုရေးခြင်း]\n A --> C[Mind Map ရေးဆွဲခြင်း]\n B --> D[အနှစ်ချုပ်လေ့လာခြင်း]\n C --> E[Visual Memory ဖြင့် မှတ်မိခြင်း]`;

                    document.getElementById('summary-text').innerText = mockSummary;
                    
                    const mermaidDiv = document.getElementById('mermaid-diagram');
                    mermaidDiv.removeAttribute('data-processed');
                    mermaidDiv.innerHTML = mockMermaid;
                    
                    mermaid.contentLoaded();

                    document.getElementById('loading').classList.add('hidden');
                    document.getElementById('result-content').classList.remove('hidden');
                }, 1500);

            } catch (error) {
                console.error("Error:", error);
                alert("အချက်အလက်များ ရယူရာတွင် အမှားယွင်းဖြစ်ပေါ်ခဲ့ပါသည်။");
                document.getElementById('loading').classList.add('hidden');
                document.getElementById('placeholder-text').classList.remove('hidden');
            }
        }

        // Export Section to PDF
        function exportPDF() {
            const { jsPDF } = window.jspdf;
            const element = document.getElementById('result-content');
            
            html2canvas(element).then(canvas => {
                const imgData = canvas.toDataURL('image/png');
                const pdf = new jsPDF('p', 'mm', 'a4');
                const imgProps = pdf.getImageProperties(imgData);
                const pdfWidth = pdf.internal.pageSize.getWidth();
                const pdfHeight = (imgProps.height * pdfWidth) / imgProps.width;
                
                pdf.addImage(imgData, 'PNG', 0, 0, pdfWidth, pdfHeight);
                pdf.save('smart-study-notes.pdf');
            });
        }
    </script>
</body>
</html>
