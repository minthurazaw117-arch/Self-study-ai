<!DOCTYPE html>
<html lang="my">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Study AI - Chapter-Based Tutor</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Mermaid.js for Diagrams -->
    <script src="https://cdn.jsdelivr.net/npm/mermaid/dist/mermaid.min.js"></script>
    <script>mermaid.initialize({ startOnLoad: false, theme: 'dark' });</script>
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { background-color: #0f172a; color: #f8fafc; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        .glass { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(10px); border: 1px solid rgba(255, 255, 255, 0.1); }
        .tab-btn.active { background-color: #3b82f6; color: white; }
    </style>
</head>
<body class="min-h-screen flex flex-col items-center p-4 sm:p-6">

    <!-- Header -->
    <header class="w-full max-w-4xl flex justify-between items-center py-4 mb-6 border-b border-slate-700">
        <div class="flex items-center gap-3">
            <div class="p-3 bg-blue-600 rounded-xl shadow-lg">
                <i class="fa-solid fa-graduation-cap text-2xl text-white"></i>
            </div>
            <div>
                <h1 class="text-2xl font-bold text-white">Smart Study AI</h1>
                <p class="text-xs text-slate-400">Personal Chapter & PDF Study Assistant</p>
            </div>
        </div>
    </header>

    <!-- Main Container -->
    <main class="w-full max-w-4xl space-y-6">

        <!-- API Key Input -->
        <section class="glass p-4 rounded-xl shadow-md">
            <label class="block text-sm font-medium text-slate-300 mb-2 flex items-center gap-2">
                <i class="fa-solid fa-key text-yellow-400"></i> Gemini API Key ထည့်သွင်းပါ:
            </label>
            <input type="password" id="apiKey" placeholder="AI Studio Key ကို ဒီမှာ ထည့်ပါ..." 
                class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
        </section>

        <!-- Input Section -->
        <section class="glass p-6 rounded-2xl shadow-xl space-y-4">
            <h2 class="text-lg font-semibold text-blue-400 flex items-center gap-2">
                <i class="fa-solid fa-book-open"></i> သင်ခန်းစာ သို့မဟုတ် PDF စာသားများ ထည့်သွင်းရန်
            </h2>
            
            <div>
                <label class="block text-xs text-slate-400 mb-1">Textbook Content / Lesson Context:</label>
                <textarea id="lessonContext" rows="5" placeholder="သင်ခန်းစာ စာသားများ သို့မဟုတ် စာအုပ်ပါ အကြောင်းအရာများကို ဤနေရာတွင် ရိုက်ထည့်ပါ သို့မဟုတ် ကူးထည့်ပါ..." 
                    class="w-full bg-slate-900 border border-slate-700 rounded-xl p-3 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500"></textarea>
            </div>

            <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
                <div>
                    <label class="block text-xs text-slate-400 mb-1">မနားလည်သည့် အခန်း / အပိုင်း (Chapter / Section):</label>
                    <input type="text" id="targetSection" placeholder="ဥပမာ- Chapter 3, Section 3.2" 
                        class="w-full bg-slate-900 border border-slate-700 rounded-lg p-2.5 text-sm text-white focus:outline-none focus:ring-2 focus:ring-blue-500">
                </div>
                <div class="flex items-end">
                    <button onclick="processStudyAI()" id="submitBtn" 
                        class="w-full bg-gradient-to-r from-blue-600 to-indigo-600 hover:from-blue-500 hover:to-indigo-500 text-white font-semibold py-2.5 px-4 rounded-xl shadow-lg transition duration-200 flex items-center justify-center gap-2">
                        <i class="fa-solid fa-wand-magic-sparkles"></i> AI ဖြင့် ရှင်းပြခိုင်းမည်
                    </button>
                </div>
            </div>
        </section>

        <!-- Output Tabs Section -->
        <section id="outputSection" class="glass p-6 rounded-2xl shadow-xl hidden space-y-4">
            
            <!-- Navigation Tabs -->
            <div class="flex flex-wrap gap-2 border-b border-slate-700 pb-3">
                <button onclick="switchTab('textTab')" id="btn-textTab" class="tab-btn active px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-file-lines"></i> စာဖြင့် ရှင်းပြချက်
                </button>
                <button onclick="switchTab('diagramTab')" id="btn-diagramTab" class="tab-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-diagram-project text-green-400"></i> Visual Diagram
                </button>
                <button onclick="switchTab('audioTab')" id="btn-audioTab" class="tab-btn bg-slate-800 hover:bg-slate-700 px-4 py-2 rounded-lg text-sm font-medium flex items-center gap-2">
                    <i class="fa-solid fa-volume-high text-purple-400"></i> Audio Tutor
                </button>
            </div>

            <!-- Tab 1: Text Explanation -->
            <div id="textTab" class="tab-content space-y-3">
                <h3 class="text-md font-semibold text-blue-300">ရှင်းလင်းချက် အနှစ်ချုပ်-</h3>
                <div id="textContent" class="text-slate-300 text-sm leading-relaxed whitespace-pre-line bg-slate-900/50 p-4 rounded-xl border border-slate-800"></div>
            </div>

            <!-- Tab 2: Diagram -->
            <div id="diagramTab" class="tab-content hidden space-y-3">
                <h3 class="text-md font-semibold text-green-300">Visual Mindmap / Flowchart:</h3>
                <div id="diagramContainer" class="bg-slate-900 p-4 rounded-xl border border-slate-800 overflow-x-auto flex justify-center">
                    <div id="mermaidOutput" class="mermaid"></div>
                </div>
            </div>

            <!-- Tab 3: Audio -->
            <div id="audioTab" class="tab-content hidden space-y-4">
                <h3 class="text-md font-semibold text-purple-300">Audio Lecture (အသံဖြင့် နားထောင်ရန်):</h3>
                <div class="bg-slate-900 p-6 rounded-xl border border-slate-800 flex flex-col items-center justify-center gap-4">
                    <div class="flex gap-4">
                        <button onclick="playAudio()" class="bg-purple-600 hover:bg-purple-500 text-white p-4 rounded-full shadow-lg">
                            <i class="fa-solid fa-play text-xl"></i>
                        </button>
                        <button onclick="pauseAudio()" class="bg-slate-700 hover:bg-slate-600 text-white p-4 rounded-full">
                            <i class="fa-solid fa-pause text-xl"></i>
                        </button>
                        <button onclick="stopAudio()" class="bg-red-600 hover:bg-red-500 text-white p-4 rounded-full">
                            <i class="fa-solid fa-stop text-xl"></i>
                        </button>
                    </div>
                    <p id="audioStatus" class="text-xs text-slate-400">Audio Ready</p>
                </div>
            </div>

        </section>

    </main>

    <script>
        let currentTextForAudio = "";
        let synth = window.speechSynthesis;
        let utterance = null;

        function switchTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(el => el.classList.add('hidden'));
            document.querySelectorAll('.tab-btn').forEach(el => {
                el.classList.remove('active', 'bg-blue-600');
                el.classList.add('bg-slate-800');
            });

            document.getElementById(tabId).classList.remove('hidden');
            document.getElementById('btn-' + tabId).classList.add('active');
            document.getElementById('btn-' + tabId).classList.remove('bg-slate-800');
        }

        async function processStudyAI() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const context = document.getElementById('lessonContext').value.trim();
            const section = document.getElementById('targetSection').value.trim();

            if (!apiKey) return alert("Gemini API Key ထည့်ပေးပါခင်ဗျာ။");
            if (!context) return alert("သင်ခန်းစာ စာသားများ ထည့်ပေးပါခင်ဗျာ။");

            const btn = document.getElementById('submitBtn');
            btn.disabled = true;
            btn.innerHTML = `<i class="fa-solid fa-spinner fa-spin"></i> AI စဉ်းစားနေသည်...`;

            const prompt = `You are a professional study tutor. 
Analyze the following textbook context and explain specifically for: ${section || "General Lesson"}.

Content: ${context}

Provide response strictly in valid JSON format with keys:
"explanation": "Detailed explanation in simple Burmese with clear examples.",
"mermaidDiagram": "Valid Mermaid.js graph code (e.g. graph TD; A-->B;) summarizing the concept."`;

            try {
                const response = await fetch(`https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({
                        contents: [{ parts: [{ text: prompt }] }],
                        generationConfig: { responseMimeType: "application/json" }
                    })
                });

                const data = await response.json();
                if (!response.ok) throw new Error(data.error?.message || "API Error");

                const result = JSON.parse(data.candidates[0].content.parts[0].text);

                // Display Text
                document.getElementById('textContent').innerText = result.explanation;
                currentTextForAudio = result.explanation;

                // Render Mermaid Diagram
                if (result.mermaidDiagram) {
                    const mermaidDiv = document.getElementById('mermaidOutput');
                    mermaidDiv.removeAttribute('data-processed');
                    mermaidDiv.innerHTML = result.mermaidDiagram;
                    mermaid.contentLoaded();
                }

                document.getElementById('outputSection').classList.remove('hidden');
                switchTab('textTab');

            } catch (err) {
                alert("Error: " + err.message);
            } finally {
                btn.disabled = false;
                btn.innerHTML = `<i class="fa-solid fa-wand-magic-sparkles"></i> AI ဖြင့် ရှင်းပြခိုင်းမည်`;
            }
        }

        function playAudio() {
            if (!currentTextForAudio) return;
            stopAudio();
            utterance = new SpeechSynthesisUtterance(currentTextForAudio);
            utterance.rate = 0.9;
            synth.speak(utterance);
            document.getElementById('audioStatus').innerText = "အသံထွက်ဖတ်ပြနေသည်...";
        }

        function pauseAudio() {
            if (synth.speaking) {
                synth.pause();
                document.getElementById('audioStatus').innerText = "ခဏရပ်ထားသည်";
            }
        }

        function stopAudio() {
            synth.cancel();
            document.getElementById('audioStatus').innerText = "Audio Stopped";
        }
    </script>
</body>
</html>
